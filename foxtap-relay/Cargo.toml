[package]
name = "foxtap-relay"
version = "0.1.0"
edition = "2021"
description = "FoxTap relay — reads shared memory from plugin, outputs to VB-Cable"

[dependencies]
foxtap-common = { path = "../foxtap-common" }
cpal = "0.15"
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
] }
